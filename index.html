<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian Prep</title>
<meta name="description" content="The free CAT platform that tells you why you got it wrong.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414; --ink2:#5b5b57; --ink3:#8d8d86;
  --paper:#fbfaf7; --card:#ffffff; --line:#e8e5de;
  --blue:#1e4b98; --blue-d:#153a78; --sky:#2f6fbf; --sky2:#6f9ede;
  --amber:#d98a1f; --rose:#c6503f;
  --r:16px; --maxw:1120px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.serif{font-family:Fraunces,Georgia,serif;font-weight:400;font-style:italic;letter-spacing:-.01em}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}

/* buttons, duolingo physics */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.01em;
  padding:14px 24px;border-radius:14px;background:var(--blue);color:#fff;
  box-shadow:0 4px 0 var(--blue-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--blue-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.btn.sm{padding:10px 16px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--blue-d)}
.btn.sm:active{transform:translateY(3px)}

/* nav */
.nav{position:sticky;top:0;z-index:60;background:rgba(251,250,247,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:68px}
.logo{font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:21px;letter-spacing:-.02em}
.logo b{font-style:normal;font-weight:900;font-family:Nunito,sans-serif;font-size:19px}
.navlinks{display:flex;gap:4px;margin-left:12px}
.navlinks button{padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink2);transition:background .15s,color .15s}
.navlinks button:hover{background:#f0ede6;color:var(--ink)}
.navlinks button.on{background:var(--ink);color:#fff}
.navr{margin-left:auto;display:flex;align-items:center;gap:12px}
.streak{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--blue);
  background:var(--sky-bg);border:1px solid #d4e1f3;padding:7px 13px;border-radius:999px}

/* hero */
.hero{position:relative;padding:76px 0 64px;overflow:hidden}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--blue-d);background:#e9f0fa;border:1px solid #c5d8f0;padding:7px 14px;border-radius:999px}
.hero h1{font-family:Fraunces,serif;font-style:italic;font-weight:400;font-size:clamp(36px,6.2vw,70px);
  line-height:1.03;letter-spacing:-.025em;margin:26px auto 0;max-width:15ch;text-align:center}
.hero h1 em{font-style:normal;font-weight:600;background:linear-gradient(transparent 62%,#c5d8f0 62%)}
.hero .sub{margin:24px auto 0;max-width:56ch;text-align:center;font-size:18px;color:var(--ink2)}
.hero .cta{display:flex;gap:12px;justify-content:center;margin-top:34px;flex-wrap:wrap}
.hero .note{text-align:center;margin-top:16px;font-size:13.5px;color:var(--ink3)}
.squig{position:absolute;pointer-events:none;opacity:.9}
.squig.l{left:-10px;top:90px;width:150px}
.squig.r{right:-30px;top:40px;width:230px}
@media(max-width:820px){.squig{display:none}}

/* wordle tiles */
.tiles{display:flex;gap:8px;justify-content:center;margin-top:44px}
.tile{width:46px;height:46px;border-radius:11px;border:2px solid var(--line);background:var(--card);
  display:grid;place-items:center;font-weight:900;font-size:17px;color:var(--ink3);
  animation:flip .5s var(--ease) both}
.tile.ok{background:var(--blue);border-color:var(--blue);color:#fff}
.tile.part{background:var(--amber);border-color:var(--amber);color:#fff}
@keyframes flip{from{transform:rotateX(-90deg);opacity:0}to{transform:none;opacity:1}}

/* sections */
section{padding:72px 0}
.shead{text-align:center;margin-bottom:44px}
.shead .k{font-weight:800;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.shead h2{font-family:Fraunces,serif;font-style:italic;font-weight:400;font-size:clamp(28px,4vw,44px);
  line-height:1.1;letter-spacing:-.02em;margin-top:12px}
.shead p{margin:14px auto 0;max-width:58ch;color:var(--ink2)}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(20,20,20,.06)}
.card h3{font-size:17px;font-weight:800;margin-bottom:8px}
.card p{font-size:14.5px;color:var(--ink2)}
.chip{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;background:#f0ede6;color:var(--ink2)}

/* poke section */
.poke{background:var(--ink);color:#fff;border-radius:28px;padding:56px 32px;margin:0 24px}
.poke h2{font-family:Fraunces,serif;font-style:italic;font-weight:400;font-size:clamp(28px,4.4vw,48px);
  line-height:1.08;text-align:center;letter-spacing:-.02em;max-width:18ch;margin:0 auto}
.poke .sub{text-align:center;color:#a8a8a2;margin:18px auto 40px;max-width:56ch}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:880px;margin:0 auto}
@media(max-width:700px){.vs{grid-template-columns:1fr}}
.vs .col{background:#1f1f1e;border:1px solid #2e2e2c;border-radius:var(--r);padding:20px}
.vs .col.good{background:#13203c;border-color:#27406e}
.vs .col .k{font-size:11.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#8d8d86;margin-bottom:14px}
.vs .col.good .k{color:#8fb6ea}
.vs li{list-style:none;padding:11px 0;border-top:1px solid #2e2e2c;font-size:14.5px;color:#d6d6d2}
.vs .col.good li{border-color:#27406e}
.vs li:first-of-type{border-top:0}

/* mentors, mentorunion layout */
.mentorbar{display:grid;grid-template-columns:240px 1fr;gap:20px}
@media(max-width:860px){.mentorbar{grid-template-columns:1fr}}
.rail{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;height:fit-content}
.rail button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:11px;font-weight:700;
  font-size:14.5px;color:var(--ink2);border-bottom:1px solid var(--line);transition:color .15s,background .15s}
.rail button:last-child{border-bottom:0}
.rail button.on{color:var(--blue-d);background:#e9f0fa}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.mcard:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(20,20,20,.08)}
.mcard .ph{height:168px;background:#ece9e2;position:relative;overflow:hidden}
.mcard .ph img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.mcard .ph .ini{position:absolute;inset:0;z-index:0;display:grid;place-items:center;font-family:Fraunces,serif;
  font-style:italic;font-size:44px;color:#fff}
.mcard .bd{padding:16px}
.mcard h4{font-size:16.5px;font-weight:800}
.mcard .role{font-size:13.5px;color:var(--ink2);margin-top:3px}
.mcard .yrs{font-size:13px;color:var(--ink3);margin-top:3px;font-family:Fraunces,serif;font-style:italic}
.mcard .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.tag{font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:8px;background:#f3f1ea;color:var(--ink2)}

/* popup, full screen daily case */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(10,10,10,.62);backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity .34s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.pop{position:fixed;z-index:91;inset:28px;max-width:860px;margin:0 auto;background:var(--paper);
  border-radius:24px;overflow:auto;opacity:0;transform:translateY(26px) scale(.985);pointer-events:none;
  transition:opacity .36s var(--ease),transform .36s var(--ease);box-shadow:0 30px 80px rgba(0,0,0,.3)}
.pop.on{opacity:1;transform:none;pointer-events:auto}
@media(max-width:700px){.pop{inset:0;border-radius:0}}
.pop .ph{position:sticky;top:0;background:rgba(251,250,247,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:12px;z-index:2}
.pop .ph .t{font-weight:900;font-size:15px}
.pop .ph .d{font-size:13px;color:var(--ink3);font-family:Fraunces,serif;font-style:italic}
.pop .x{margin-left:auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:19px;color:var(--ink2);background:#f0ede6}
.pop .pb{padding:26px}
.prog{height:9px;background:#ece9e2;border-radius:999px;overflow:hidden;margin:0 26px 20px}
.prog i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .5s var(--ease)}

.passage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:22px}
.passage p{margin-bottom:13px;font-size:15.5px;color:var(--ink2)}
.passage p:last-child{margin:0}
.qstem{font-size:17.5px;font-weight:700;line-height:1.45;margin:4px 0 18px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);
  border-radius:14px;padding:15px 18px;margin-bottom:10px;font-size:15px;font-weight:600;
  transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:#cfcabd}
.opt:active{transform:scale(.995)}
.opt.ok{border-color:var(--blue);background:#e9f0fa}
.opt.no{border-color:var(--rose);background:#fdeeec}
.why{margin-top:16px;background:var(--sky-bg);border:1px solid #d4e1f3;border-radius:14px;padding:17px}
.why .k{font-size:11.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:7px}
.why p{font-size:14.5px;color:#2c3c58}

/* result */
.scorebig{font-family:Fraunces,serif;font-style:italic;font-size:64px;line-height:1;text-align:center}
.pcpill{display:block;width:fit-content;margin:16px auto 0;font-weight:900;font-size:14px;
  background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px}

/* app views */
.view{padding:36px 0 80px}
.ph1{font-family:Fraunces,serif;font-style:italic;font-size:34px;letter-spacing:-.02em}
.psub{color:var(--ink2);margin-top:8px;margin-bottom:26px}

/* mock */
.mock{position:fixed;inset:0;z-index:95;background:#fff;display:none;flex-direction:column;font-family:Arial,sans-serif}
.mock.on{display:flex}
.mock .mh{background:#2b3f6b;color:#fff;padding:11px 16px;display:flex;align-items:center;gap:14px;font-size:14px}
.mock .mb{flex:1;display:grid;grid-template-columns:1fr 268px;overflow:hidden}
.mock .mq{padding:22px;overflow:auto}
.mock .mp{border-left:1px solid #ccc;background:#f4f6fa;padding:14px;overflow:auto}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.pal b{display:grid;place-items:center;height:36px;border-radius:6px;font-size:13px;background:#d9d9d9;cursor:pointer}
.pal b.ans{background:#2fa84f;color:#fff}.pal b.mark{background:#6c3fa0;color:#fff}.pal b.cur{outline:3px solid #2b3f6b}
.mf{border-top:1px solid #ccc;padding:11px 16px;display:flex;gap:10px;background:#f4f6fa}
.mf button{padding:9px 16px;border:1px solid #999;border-radius:4px;background:#fff;font-size:13px}
.mf .go{background:#2b3f6b;color:#fff;border-color:#2b3f6b;margin-left:auto}

/* loader */
.loader{position:fixed;inset:0;z-index:99;background:var(--paper);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px}
.loader.on{display:flex}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader p{max-width:42ch;text-align:center;color:var(--ink2);font-size:15.5px}

footer{border-top:1px solid var(--line);padding:40px 0;color:var(--ink3);font-size:14px}

/* ---- dark band ---- */
.dark{background:var(--ink);color:#fff}
.dark .shead .k{color:#8d8d86}
.dark .shead p{color:#a8a8a2}
.band{position:relative;overflow:hidden}
.wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:Fraunces,serif;font-style:italic;font-size:30vw;line-height:1;color:#efece4;
  pointer-events:none;user-select:none;z-index:0;white-space:nowrap}
.dark .wm{color:#1c1c1b}
.band .wrap{position:relative;z-index:1}

/* ---- hero, dark ---- */
.hero2{position:relative;background:var(--ink);color:#fff;overflow:hidden;padding:88px 0 96px;min-height:min(78vh,680px);display:flex;align-items:center}
.hero2 .mix{font-family:Nunito,sans-serif;font-weight:800;font-size:clamp(34px,6vw,66px);line-height:1.06;
  letter-spacing:-.03em;text-align:center;max-width:16ch;margin:26px auto 0}
.hero2 .mix i{font-family:Fraunces,serif;font-style:italic;font-weight:400;letter-spacing:-.015em;
  background:linear-gradient(94deg,#8fb6ea,#ffffff 52%,#6f9ede);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero2 .sub{margin:22px auto 0;max-width:52ch;text-align:center;color:#a8a8a2;font-size:17px}
.hero2 .eyebrow{display:block;width:fit-content;margin:0 auto;font-weight:800;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;color:#8fb6ea;border:1px solid #27406e;background:#13203c;padding:7px 15px;border-radius:999px}
.pill{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:14.5px;padding:13px 24px;
  border-radius:999px;border:1.5px solid rgba(255,255,255,.35);color:#fff;transition:background .2s,border-color .2s,transform .1s}
.pill:hover{background:rgba(255,255,255,.1);border-color:#fff}
.pill:active{transform:scale(.97)}
.pill.solid{background:var(--blue);border-color:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.pill.solid:active{transform:translateY(4px);box-shadow:0 0 0 var(--blue-d)}
.pill.dk{border-color:rgba(20,20,20,.25);color:var(--ink)}
.pill.dk:hover{background:rgba(20,20,20,.06);border-color:var(--ink)}

/* orbiting avatars */
.orb{position:absolute;inset:0;pointer-events:none}
.orb svg{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.av{position:absolute;width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.5);
  box-shadow:0 8px 24px rgba(0,0,0,.4);animation:bob 7s ease-in-out infinite}
.av img{width:100%;height:100%;object-fit:cover}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@media(max-width:860px){.av{display:none}.orb svg{display:none}}

/* squiggle heading */
.sq{display:block;width:118px;height:14px;margin:8px auto 0}
.quote{font-family:Fraunces,serif;font-style:italic;font-size:clamp(23px,3.4vw,38px);line-height:1.3;
  text-align:center;max-width:22ch;margin:0 auto;letter-spacing:-.015em}

/* case band */
.casebar{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:34px 28px;text-align:center;
  box-shadow:0 18px 50px rgba(20,20,20,.05)}
.casebar .k{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.casebar h3{font-family:Fraunces,serif;font-style:italic;font-size:clamp(23px,3vw,34px);margin-top:10px;letter-spacing:-.02em}
.metarow{display:flex;gap:26px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.metarow div{text-align:center}
.metarow b{display:block;font-family:Fraunces,serif;font-style:italic;font-size:27px;line-height:1}
.metarow span{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}

/* cause cards */
.cause{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;position:relative;overflow:hidden}
.cause .n{font-family:Fraunces,serif;font-style:italic;font-size:46px;line-height:1;color:var(--line)}
.cause h3{margin-top:10px;font-size:17px;font-weight:800}
.cause p{font-size:14.5px;color:var(--ink2);margin-top:7px}
.cause .sig{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3)}
.cause .sig b{color:var(--ink2)}


/* ---- v2 layout ---- */
:root{--sky-bg:#f1f5fb}
.herocta{display:flex;gap:12px;justify-content:center;margin-top:34px;flex-wrap:wrap}
.herostats{display:flex;gap:0;justify-content:center;margin-top:52px;border-top:1px solid #2a2a28;padding-top:26px;max-width:620px;margin-left:auto;margin-right:auto}
.herostats div{flex:1;text-align:center;border-right:1px solid #2a2a28}
.herostats div:last-child{border-right:0}
.herostats b{display:block;font-family:Fraunces,serif;font-style:italic;font-size:30px;line-height:1;color:#fff}
.herostats span{display:block;margin-top:7px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7a7a75}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card)}
@media(max-width:860px){.steps{grid-template-columns:1fr}}
.step{padding:30px 26px;border-right:1px solid var(--line)}
.step:last-child{border-right:0}
@media(max-width:860px){.step{border-right:0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}}
.step .sn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sky-bg);
  color:var(--blue);font-weight:900;font-size:15px;margin-bottom:16px}
.step h3{font-size:18px;font-weight:800}
.step p{font-size:14.5px;color:var(--ink2);margin-top:8px}
.lnk{margin-top:14px;font-weight:800;font-size:14px;color:var(--blue);display:inline-flex;gap:5px;align-items:center}
.lnk:hover{text-decoration:underline}

.fineprint{text-align:center;margin:28px auto 0;max-width:72ch;color:var(--ink3);font-size:14px}
.dark.band{border-radius:0}
section.band{padding:84px 0}
.shead{margin-bottom:40px}

/* case entry card */
.casecta{display:flex;align-items:center;gap:22px;background:var(--ink);color:#fff;border-radius:20px;padding:26px 28px;flex-wrap:wrap}
.casecta .t{font-family:Fraunces,serif;font-style:italic;font-size:24px;letter-spacing:-.02em}
.casecta .d{font-size:13.5px;color:#a8a8a2;margin-top:5px}
.casecta .r{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:620px){.casecta .r{margin-left:0;width:100%}}

</style>
</head>
<body>

<div class="loader" id="loader"><div class="spin"></div><p id="loadmsg"></p></div>

<nav class="nav"><div class="wrap">
  <div class="logo">meridian<b>.</b></div>
  <div class="navlinks" id="navlinks"></div>
  <div class="navr">

let io;
function observe(){
  io && io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),
    {threshold:0, rootMargin:'0px 0px -8% 0px'});
  const els=$$('.rv');
  els.forEach((el,i)=>{ el.style.transitionDelay=(Math.min(i,8)*55)+'ms'; io.observe(el); });
  clearTimeout(window._rvT);
  window._rvT=setTimeout(()=>els.forEach(el=>el.classList.add('in')),2600);
}

              onclick="book(${MENTORS.indexOf(m)})">Book 30 minutes</button>
          </div></div>`).join('')}
      </div>
    </div>
    ${list.length===0?'<p style="margin-top:24px;color:var(--ink3)">Nobody in that domain yet. Campus activation runs through week one.</p>':''}
  </div></div>`;
}
function setDom(d){ MDOM=d; render(); }
function book(i){
  const m=MENTORS[i];
  if(S.credits<1){ alert('You are out of credits. Finish today’s case and another one opens up.'); return; }
  S.credits-=1; save();
  alert('Sent to '+m.n+'. They run their own calendar, so the confirmation will come from them and not from us.');
  render();
}

/* ---------- concepts ---------- */
function vRepo(){
  const i=S.repoStage, q=REPO.quiz[i];
  return `<div class="view"><div class="wrap" style="max-width:780px">
    <span class="chip">You were sent here by your last wrong answer</span>
    <h1 class="ph1" style="margin-top:14px">${REPO.title}</h1>
    <p class="psub">Read it through once and then prove you have it. The questions keep getting harder until you decide to stop, so where you stop is the honest answer.</p>
    <div class="casecta rv" style="margin-bottom:24px">
      <div><div class="t">Today&rsquo;s case</div>
        <div class="d">The question that sent you to this page is sitting inside it</div></div>
      <div class="r"><button class="pill solid" onclick="openPop()">Open the case &#8599;</button></div>
    </div>
    <div class="card" style="padding:26px">${REPO.body.map(p=>`<p style="margin-bottom:13px;color:var(--ink2);font-size:15.5px">${p}</p>`).join('')}</div>
    <div style="margin-top:26px">
      ${i<REPO.quiz.length?`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <span class="chip">${q.lvl}</span>
          <span style="margin-left:auto;font-size:13px;color:var(--ink3)">${i+1} of ${REPO.quiz.length}</span>
        </div>
        <p class="qstem">${q.stem}</p>
        ${q.opts.map((o,k)=>`<button class="opt" onclick="repoAns(${k})">${o}</button>`).join('')}`
      : `<div class="card" style="text-align:center;padding:34px">
          <div class="scorebig">${S.repoScore} / ${REPO.quiz.length}</div>
          <p style="margin-top:14px;color:var(--ink2)">That concept is closed now, so the method work underneath it has opened up.</p>
          <button class="btn" style="margin-top:18px" onclick="S.repoStage=0;S.repoScore=0;save();render()">Run it again</button>
        </div>`}
    </div>
  </div></div>`;
}
function repoAns(k){
  const q=REPO.quiz[S.repoStage];
  if(k===q.ans) S.repoScore++;
  S.repoStage++; save(); render();
}

/* ---------- practice ---------- */
function vPractice(){
  const rows=[
    ['Percentage change on a shifting base','QA','Concept gap','3 times','repo'],
    ['Paragraph summary, argument vs true statement','VARC','Selection error','2 times','repo'],
    ['Set selection under a ceiling constraint','DI/LR','Method error','2 times','repo'],
    ['Logarithms, base change','QA','Concept gap','4 times','repo']
  ];
  return `<div class="view"><div class="wrap">
    <h1 class="ph1">Where you keep faulting</h1>
    <p class="psub">All of this came out of how you answered, so there is nothing on this page for you to fill in or keep updated, which is the only reason it still exists three weeks in.</p>
    <div class="grid g2">
      ${rows.map(r=>`<div class="card rv">
        <div style="display:flex;gap:8px;margin-bottom:10px"><span class="chip">${r[1]}</span>
          <span class="chip" style="background:#fdeeec;color:#a33">${r[2]}</span></div>
        <h3>${r[0]}</h3>
        <p style="margin-top:6px">Missed <b>${r[3]}</b> in the last three weeks. Same cause each time.</p>
        <button class="btn sm" style="margin-top:14px" onclick="go('repo')">Fix this one</button>
      </div>`).join('')}
    </div>
    <div class="card" style="margin-top:20px;background:var(--sky-bg);border-color:#d4e1f3">
      <h3>Why you are only seeing one fix</h3>
      <p>Three of these have a second cause sitting underneath them, and we are holding those back until you clear the first one, because speeding up a method on a concept you do not actually have yet only makes you faster at getting it wrong.</p>
    </div>
  </div></div>`;
}

/* ---------- you ---------- */
function vYou(){
  return `<div class="view"><div class="wrap" style="max-width:820px">
    <h1 class="ph1">You</h1>
    <p class="psub">This filled itself in over a few visits. You were never made to sit through a form before you could use anything.</p>
    <div class="grid g2">
      <div class="card rv"><h3>Profile read</h3>
        <p>${S.profile?('Work experience '+S.profile+'. Matched against the profile of candidates who actually convert, by institute.'):'Tell us one thing and this starts working. It never blocks anything.'}</p>
        <button class="btn sm" style="margin-top:14px" onclick="onboard()">${S.profile?'Update it':'Add work experience'}</button></div>
      <div class="card rv"><h3>Subject scores</h3>
        <p>VARC 68, DILR 54, QA 61. Your percentile lives in the weekly mock and in the daily case, and it stays out of here, because seeing a percentile on every screen in week two of a preparation has never helped anybody.</p></div>
      <div class="card rv"><h3>Streak</h3><p>${S.streak||0} days. A streak is a nudge and not much more, which is why the thing we actually lean on is a call you have booked with a person who is expecting you.</p></div>
      <div class="card rv"><h3>Credits</h3><p>${S.credits} of 10. Two open straight away and the rest unlock as you use the platform, because there are a lot more of you than there are mentors.</p></div>
    </div>
  </div></div>`;
}
function onboard(){
  const v=prompt('How much work experience do you have? Answer in months, or in years if it is more than two.');
  if(v){ S.profile=v+' months'; S.signed=true; save(); render(); }
}

/* ---------- mocks ---------- */
function vMock(){
  return `<div class="view"><div class="wrap" style="max-width:860px">
    <div class="casecta rv" style="margin-bottom:30px">
      <div><div class="t">Today&rsquo;s case</div>
        <div class="d">${CASE.date}. ${CASE.title}. Five questions, all off the one situation.</div></div>
      <div class="r">
        ${S.caseDone?`<span class="chip" style="background:#243049;color:#9fc0ee">${S.casePct}th percentile</span>`:''}
        <button class="pill solid" onclick="openPop()">${S.caseDone?'Open it again':'Play it now'} &#8599;</button></div>
    </div>
    <h1 class="ph1">Weekly mock</h1>
    <p class="psub">The interface is the one you will sit in on the day, palette and all, because a mock that feels nothing like the exam is only testing whether you can do sums.</p>
    <div class="grid g2">
      <div class="card rv" style="padding:26px"><span class="chip" style="background:#e9f0fa;color:#153a78">Mode one</span>
        <h3 style="margin-top:12px;font-size:21px">Pegged to you</h3>
        <p>Every concept in here is one you have already cleared, so if you get something wrong it was never because you did not know it. This paper is measuring how fast you are and what you chose to attempt.</p>
        <button class="btn" style="margin-top:18px;width:100%;justify-content:center" onclick="openMock('pegged')">Start pegged paper</button></div>
      <div class="card rv" style="padding:26px"><span class="chip" style="background:#fdeeec;color:#a33">Mode two</span>
        <h3 style="margin-top:12px;font-size:21px">National level</h3>
        <p>Full CAT difficulty, so there will be questions you cannot do. Finding out which ones is the reason you sit it.</p>
        <button class="btn ghost" style="margin-top:18px;width:100%;justify-content:center" onclick="openMock('national')">Start national paper</button></div>
    </div>
    <div class="card" style="margin-top:22px">
      <h3>What your last mock said about your picks</h3>
      <p style="margin-top:10px">Worked out from what you actually opened and left, rather than from anything you told us afterwards.</p>
      <ul style="list-style:none;margin-top:14px">
        <li style="padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink2)">
          <b style="color:var(--ink)">You opened 4 sets in DILR and entered 2.</b> Both were in topics where your accuracy sits under 40 percent. You spent 13 minutes there and scored 2 marks.</li>
        <li style="padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink2)">
          <b style="color:var(--ink)">You opened set 3 for 9 seconds and left it.</b> That is a seating arrangement, your strongest set type this month, and it was worth 4 marks.</li>
        <li style="padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink2)">
          <b style="color:var(--ink)">Net.</b> Swapping your two picks for the one you abandoned moves you 6 marks on the same clock, answering one fewer question.</li>
      </ul>
    </div>
  </div></div>`;
}

/* ---------- mock engine ---------- */
let mockTimer=null;
function openMock(mode){
  S.mock={mode,i:0,ans:{},mark:{},t:2400}; save();
  $('#mocksec').textContent = mode==='pegged'?'Section: Quantitative Aptitude, pegged':'Section: Quantitative Aptitude, national level';
  $('#mock').classList.add('on');
  drawMock(); drawPal();
  clearInterval(mockTimer);
  mockTimer=setInterval(()=>{
    S.mock.t--; const m=String(Math.floor(S.mock.t/60)).padStart(2,'0'), s=String(S.mock.t%60).padStart(2,'0');
    $('#mocktime').textContent=m+':'+s;
    if(S.mock.t<=0) endMock();
  },1000);
}
function drawMock(){
  const i=S.mock.i;
  $('#mockq').innerHTML=`
    <div style="font-size:13px;color:#555;margin-bottom:12px">Question ${i+1}</div>
    <p style="font-size:16px;line-height:1.6;margin-bottom:18px">
      ${S.mock.mode==='pegged'
        ? 'A shopkeeper marks up by 40 percent and then offers a discount of 25 percent. The net profit percentage is:'
        : 'If f(x) = x&sup2; - 6x + k has both roots positive and distinct, the number of integer values k can take is:'}
    </p>
    ${['5 percent','10 percent','15 percent','No profit'].map((o,k)=>`
      <label style="display:block;padding:9px 0;font-size:15px">
        <input type="radio" name="mq" ${S.mock.ans[i]===k?'checked':''} onchange="S.mock.ans[${i}]=${k};drawPal()"> ${o}</label>`).join('')}`;
}
function drawPal(){
  const p=$('#pal'); let h='';
  for(let k=0;k<12;k++){
    const cls = S.mock.mark[k]?'mark':(S.mock.ans[k]!=null?'ans':'');
    h+=`<b class="${cls} ${k===S.mock.i?'cur':''}" onclick="S.mock.i=${k};drawMock();drawPal()">${k+1}</b>`;
  }
  p.innerHTML=h;
  const a=Object.keys(S.mock.ans).length, mk=Object.keys(S.mock.mark).length;
  $('#cAns').textContent=a; $('#cNo').textContent=12-a-mk; $('#cMk').textContent=mk;
}
function clearResp(){ delete S.mock.ans[S.mock.i]; drawMock(); drawPal(); }
function markRev(){ S.mock.mark[S.mock.i]=1; S.mock.i=Math.min(11,S.mock.i+1); drawMock(); drawPal(); }
function saveNext(){ S.mock.i=Math.min(11,S.mock.i+1); drawMock(); drawPal(); }
function endMock(){
  clearInterval(mockTimer); $('#mock').classList.remove('on'); S.mock=null; save();
  loader(()=>{ S.tab='mock'; render(); });
}

/* ---------- chrome and boot ---------- */
function drawNav(){
  $('#navlinks').innerHTML = TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  $('#streakn').textContent = S.streak||0;
  $('#signbtn').textContent = S.signed?'You':'Sign up';
  $('#signbtn').onclick = S.signed?()=>go('you'):onboard;
}
function render(){
  drawNav();
  const v={today:vToday,practice:vPractice,mock:vMock,repo:vRepo,mentor:vMentor,you:vYou}[S.tab]||vToday;
  view.innerHTML=v();
  observe();
}
render();
</script>
</body>
</html>
